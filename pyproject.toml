[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flusight-fm"
version = "0.2.0"
description = "OHTJHU-BM: FluSight forecasts from an ensemble of time-series foundation models"
readme = "README.md"
requires-python = ">=3.11,<3.13"
classifiers = ["License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication"]
# pyarrow >= 24 needs numpy 2, but the model packages (gluonts via Moirai) hold
# numpy at 1.x; pip can't see the clash because pyarrow doesn't declare numpy.
dependencies = [
    "numpy",
    "pandas>=2.0",
    "pyarrow>=14,<24",
    "requests",
    "torch>=2.4",
]

[project.optional-dependencies]
# transformers 5 needs torch >= 2.6, but uni2ts (Moirai) pins torch < 2.5.
chronos = ["chronos-forecasting>=2.1", "transformers>=4.41,<5"]
timesfm = ["timesfm[torch]"]
moirai = ["uni2ts @ git+https://github.com/SalesforceAIResearch/uni2ts.git"]
timestral = ["timestral @ git+https://github.com/mistralai/timestral.git"]
finetune = ["chronos-forecasting>=2.1", "transformers>=4.41,<5", "peft", "accelerate"]
all = ["flusight-fm[chronos,timesfm,moirai,timestral]"]

[project.scripts]
flusight = "flusight_fm.cli:main"

[tool.setuptools]
packages = ["flusight_fm"]

[tool.setuptools.package-data]
flusight_fm = ["report_template.html", "revisions_template.html"]
